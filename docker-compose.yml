name: runspace

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - '${WEB_PORT:-3000}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge-local-password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${NATS_CLIENT_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10

  nats-box:
    image: natsio/nats-box:0.14.0
    profiles: [tools]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    command: ['sleep', 'infinity']

  agent-image:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: runspace-agent:latest
    command: ['sh', '-c', 'exit 0']

  syncthing:
    image: syncthing/syncthing:2.1.1
    restart: unless-stopped
    environment:
      STGUIADDRESS: 0.0.0.0:8384
      STGUIAPIKEY: ${SYNCTHING_API_KEY:-runspace-syncthing-local-key}
      STNOUPGRADE: '1'
    ports:
      - '${SYNCTHING_SYNC_PORT:-22001}:22000/tcp'
      - '${SYNCTHING_SYNC_PORT:-22001}:22000/udp'
    volumes:
      - syncthing-config:/var/syncthing
      - repository-data:/var/lib/runspace/repositories
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        DOCKER_GID: ${DOCKER_GID:-0}
    restart: unless-stopped
    environment:
      PORT: 8080
      REPOSITORY_ROOT: /var/lib/runspace/repositories
      AGENT_IMAGE: ${AGENT_IMAGE:-runspace-agent:latest}
      REPOSITORY_VOLUME: ${REPOSITORY_VOLUME_NAME:-runspace-repository-data}
      ACP_COMMAND: ${ACP_COMMAND:-}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-http://host.docker.internal:7799}
      CHANNEL_SECRET_KEY: ${CHANNEL_SECRET_KEY:-runspace-local-channel-secret}
      DATABASE_URL: postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge-local-password}@postgres:5432/${POSTGRES_DB:-forge}?sslmode=disable
      NATS_URL: nats://nats:4222
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SYNCTHING_URL: http://syncthing:8384
      SYNCTHING_API_KEY: ${SYNCTHING_API_KEY:-runspace-syncthing-local-key}
      SYNCTHING_GATEWAY_ADDRESSES: tcp://127.0.0.1:${SYNCTHING_SYNC_PORT:-22001}
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      agent-image:
        condition: service_completed_successfully
      syncthing:
        condition: service_started
    volumes:
      - repository-data:/var/lib/runspace/repositories
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    group_add:
      - '${DOCKER_GID:-0}'
    labels:
      - traefik.enable=true
      - traefik.http.routers.runspace-gateway.rule=PathPrefix(`/gateway`)
      - traefik.http.routers.runspace-gateway.entrypoints=web
      - traefik.http.routers.runspace-gateway.priority=100
      - traefik.http.routers.runspace-gateway.middlewares=runspace-strip-gateway,runspace-add-api
      - traefik.http.middlewares.runspace-strip-gateway.stripprefix.prefixes=/gateway
      - traefik.http.middlewares.runspace-add-api.addprefix.prefix=/api/v1
      - traefik.http.services.runspace-gateway.loadbalancer.server.port=8080
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/gateway}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-runspace-development-secret-change-me}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      LOCAL_AUTH_USERS: ${LOCAL_AUTH_USERS:-admin:admin,alice:alice,nahid:nahid123}
      NEXT_PUBLIC_USER_ID: ${NEXT_PUBLIC_USER_ID:-admin}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
    expose:
      - '3000'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000 >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.runspace-web.rule=PathPrefix(`/`)
      - traefik.http.routers.runspace-web.entrypoints=web
      - traefik.http.routers.runspace-web.priority=1
      - traefik.http.services.runspace-web.loadbalancer.server.port=3000

volumes:
  postgres-data:
  nats-data:
  syncthing-config:
  repository-data:
    name: ${REPOSITORY_VOLUME_NAME:-runspace-repository-data}
