name: quality

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm quality:files
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    runs-on: ubuntu-latest
    # The persistence tests skip themselves without DATABASE_URL, so without a
    # database CI would silently cover none of the SQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://forge:forge-local-password@127.0.0.1:5432/forge?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "${files}"
            exit 1
          fi
      # -race guards the goroutine hand-off between a parked turn and the
      # request that returned before it.
      - run: go test -race ./...
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: '2025.1.1'
          install-go: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4

  stack:
    runs-on: ubuntu-latest
    # Nothing exercised the documented first-run path, so a broken quick start
    # survived unnoticed: the web container's healthcheck could never pass and
    # `docker compose up` never came up at all. Bringing the stack up here is the
    # cheapest way to keep that honest.
    steps:
      - uses: actions/checkout@v7
      - name: Bring up Compose
        run: |
          node scripts/init-env.mjs
          docker compose up -d --build
      - name: Wait for every service to report healthy
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker compose ps --format '{{.Service}} {{.Health}}')"
            unhealthy="$(echo "${status}" | awk '$2 != "healthy" && $2 != "" { print $1 }')"
            if [ -z "${unhealthy}" ]; then
              echo "all services healthy"; exit 0
            fi
            sleep 5
          done
          echo "still unhealthy: ${unhealthy}"
          docker compose ps
          docker compose logs --tail 80
          exit 1
      - name: Smoke test
        run: node scripts/smoke-test.mjs
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
