version: '2'
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - nilerr
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - whitespace
    - cyclop
    - funlen
formatters:
  enable:
    - gofmt
    - goimports
run:
  timeout: 3m
  tests: true
linters-settings:
  cyclop:
    max-complexity: 10
  funlen:
    lines: 80
    statements: 40
issues:
  exclude-rules:
    - path: .*_test\.go$
      linters:
        - cyclop
        - funlen
